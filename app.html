:root{
  --ground:#ffe9f0; --paper:#fff6f9; --ink:#5a2a3c; --ink2:#8e5470; --rose:#ff6f9c; --rose2:#e64f7e; --rose0:#ffd3e0;
  --p:2px; --f1:15px; --f2:20px; --f3:30px;
  --font:'Px',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:conic-gradient(#ffe2eb 25%,#ffe9f0 0 50%,#ffe2eb 0 75%,#ffe9f0 0) 0 0/24px 24px;color:var(--ink);font:var(--f2)/1.2 var(--font);font-synthesis:none;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
h1,h2,b{font-weight:400}
button{font:inherit;color:inherit;border:0;border-radius:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
input{-webkit-user-select:text;user-select:text}
:focus{outline:none}
:focus-visible{outline:var(--p) dashed var(--rose2);outline-offset:calc(var(--p) * 3)}
.pb2{--bc:var(--ink);--bg:#fff;--ds:rgba(90,42,60,.2);background:linear-gradient(var(--bc),var(--bc)) 0 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 0 100%/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--p) var(--p) no-repeat,var(--bg);box-shadow:0 calc(var(--p) * -2) 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 2) 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * -2) 0 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * 2) 0 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 4) 0 calc(var(--p) * -1) var(--ds)}
.pb{--bc:var(--ink);--bg:#fff;--hi:transparent;--sh:transparent;--ds:rgba(90,42,60,.2);background:var(--bg);box-shadow:0 calc(var(--p) * -1) 0 0 var(--bc),0 var(--p) 0 0 var(--bc),calc(var(--p) * -1) 0 0 0 var(--bc),var(--p) 0 0 0 var(--bc),0 calc(var(--p) * 2) 0 0 var(--ds),inset 0 var(--p) 0 0 var(--hi),inset 0 calc(var(--p) * -2) 0 0 var(--sh)}
.press:active{transform:translateY(var(--p));--ds:transparent}
.card{--bc:#ef9cbb;--bg:var(--paper);--ds:rgba(230,79,126,.22);width:100%;max-width:420px;padding:20px 18px 24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.who{flex:1 1 auto;min-width:0;font-size:var(--f1);line-height:1.3;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.who b{display:block;font-size:var(--f2);color:var(--ink)}
.mini{--bg:#fff;flex:none;min-height:34px;padding:0 10px 2px;font-size:var(--f1);line-height:1;color:var(--ink2)}
.lead{margin:0 0 20px;padding:16px 14px;font-size:var(--f1);line-height:1.45;color:var(--ink);text-align:center;background:#fff1f6;box-shadow:inset 0 0 0 var(--p) #ffd3e0}
.open{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);width:100%;min-height:52px;margin-bottom:20px;padding:0 14px 2px;color:#fff;font-size:var(--f2);line-height:1;text-shadow:0 var(--p) 0 rgba(170,30,85,.4)}
h2{margin:20px 0 10px;font-size:var(--f1);line-height:1;color:var(--ink2)}
h2:first-of-type{margin-top:0}
.add{display:flex;gap:10px;margin-bottom:6px}
.add input{flex:1 1 auto;min-width:0;height:44px;padding:0 12px;font:var(--f2)/1 var(--font);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.add input:focus{--bc:var(--rose2)}
.add button{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);flex:none;min-height:44px;padding:0 14px 2px;color:#fff;font-size:var(--f1);line-height:1;text-shadow:0 var(--p) 0 rgba(170,30,85,.4)}
.msg{min-height:15px;margin:0 0 6px;font-size:var(--f1);line-height:1.3;color:var(--rose2)}
.msg.ok{color:var(--ink2)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{--bg:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.row .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;font-size:var(--f1);line-height:1.25;color:var(--ink2);white-space:normal}
.act{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);flex:none;min-height:34px;padding:0 10px 2px;color:#fff;font-size:var(--f1);line-height:1}
.act.ghost{--bg:#fff;--bc:#ef9cbb;--hi:transparent;--sh:transparent;color:var(--rose2)}
.act[disabled]{opacity:.45;pointer-events:none}
.empty{margin:0;font-size:var(--f1);line-height:1.4;color:var(--ink2)}
.note{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(90,42,60,.34)}
.note-card{--bg:#fff;width:min(100%,340px);display:flex;flex-direction:column;gap:18px;padding:22px 18px 20px;text-align:center}
.note-card h3{margin:0;font-size:var(--f3);line-height:1}
.note-card p{margin:0;font-size:var(--f1);line-height:1.5;color:var(--ink2)}
.note-card p b{color:var(--ink)}
.note-act{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.note-act button{min-height:42px;padding:0 14px 2px;font-size:var(--f1);line-height:1}
.load{padding:40px 0;text-align:center;font-size:var(--f1);color:var(--ink2)}
</style>
</head>
<body>
<main class="card pb2">
  <div class="top">
    <span class="who"><b id="me">…</b>ваш логин</span>
    <button class="mini pb press" type="button" id="out">Выйти</button>
  </div>

  <div id="body" class="load">Загрузка…</div>
</main>

<div class="note" id="note" hidden>
  <div class="note-card pb2">
    <h3>Памятка</h3>
    <p>Питомец заводится <b>только с одним человеком</b>. После создания сменить напарника нельзя, второго питомца завести тоже нельзя.</p>
    <p>Создать питомца с <b id="noteWho"></b>?</p>
    <div class="note-act">
      <button class="act pb press" type="button" id="noteOk">Пригласить</button>
      <button class="act ghost pb press" type="button" id="noteNo">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
import { CONFIGURED, LOGIN_RE, onAuth, loginOf, leave, sendFriendRequest, acceptFriend, dropFriendRequest,
         invitePet, acceptPet, dropPetInvite, watchLobby, watchMyPet, petOwners, errText } from './fb.js';
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const body = $('#body'), note = $('#note');
let me = null, myLogin = '', petId = null, lobby = null, owners = {}, busy = false, asking = null;

const other = (f) => f.uids.find((u) => u !== me);
const nameOf = (f) => (f.names && f.names[other(f)]) || '—';
let msgT = 0, msgNow = null;
function say(text, ok) {
  msgNow = text ? { t: text, ok: !!ok } : null;
  const el = $('#msg');
  if (el) { el.textContent = text || ''; el.classList.toggle('ok', !!ok); }
  clearTimeout(msgT);
  if (text) msgT = setTimeout(() => say(''), 4000);
}

function render() {
  if (!lobby) return;
  const keep = (() => { const el = $('#findLogin'); return el ? { v: el.value, f: document.activeElement === el } : null; })();

  let h = '';

  h += '<p class="lead">Добавьте в друзья человека и создайте с ним питомца, чтобы начать.</p>';

  h += '<h2>Добавить в друзья</h2>'
    + '<div class="add"><input class="pb" id="findLogin" placeholder="логин" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="16">'
    + '<button class="pb press" type="button" id="findBtn">Добавить</button></div><p class="msg" id="msg"></p>';

  if (lobby.incoming.length) {
    h += '<h2>Заявки в друзья</h2><ul class="list">';
    lobby.incoming.forEach((r, i) => {
      h += '<li class="row pb"><span class="nm">' + esc(r.fromLogin) + '<small>хочет добавить вас</small></span>'
        + '<button class="act pb press" type="button" data-act="accept" data-i="' + i + '">Принять</button>'
        + '<button class="act ghost pb press" type="button" data-act="decline" data-i="' + i + '">Нет</button></li>';
    });
    h += '</ul>';
  }

  if (lobby.petIn.length && !petId) {
    h += '<h2>Приглашения завести питомца</h2><ul class="list">';
    lobby.petIn.forEach((v, i) => {
      h += '<li class="row pb"><span class="nm">' + esc(v.fromLogin) + '<small>зовёт создать питомца</small></span>'
        + '<button class="act pb press" type="button" data-act="petYes" data-i="' + i + '">Принять</button>'
        + '<button class="act ghost pb press" type="button" data-act="petNo" data-i="' + i + '">Нет</button></li>';
    });
    h += '</ul>';
  }

  h += '<h2>Друзья</h2>';
  if (!lobby.friends.length) {
    h += '<p class="empty">Пока никого. Добавьте человека по логину.</p>';
  } else {
    h += '<ul class="list">';
    lobby.friends.forEach((f, i) => {
      const u = other(f), sent = lobby.petOut.some((v) => v.to === u);
      let btn = '', sub = '';
      if (petId) btn = '';
      else if (sent) { btn = '<button class="act ghost pb press" type="button" data-act="petCancel" data-u="' + u + '">Отменить</button>'; sub = '<small>приглашение отправлено</small>'; }
      else if (owners[u]) { btn = '<button class="act pb" type="button" disabled>Занят</button>'; sub = '<small>уже с питомцем</small>'; }
      else btn = '<button class="act pb press" type="button" data-act="petAsk" data-i="' + i + '">Создать питомца</button>';
      h += '<li class="row pb"><span class="nm">' + esc(nameOf(f)) + sub + '</span>' + btn + '</li>';
    });
    h += '</ul>';
  }

  if (lobby.outgoing.length) {
    h += '<h2>Отправленные заявки</h2><ul class="list">';
    lobby.outgoing.forEach((r, i) => {
      h += '<li class="row pb"><span class="nm">' + esc(r.toLogin) + '<small>ждёт подтверждения</small></span>'
        + '<button class="act ghost pb press" type="button" data-act="cancel" data-i="' + i + '">Отменить</button></li>';
    });
    h += '</ul>';
  }

  body.className = '';
  body.innerHTML = h;
  if (keep) { const el = $('#findLogin'); el.value = keep.v; if (keep.f) el.focus(); }
  if (msgNow) { const el = $('#msg'); el.textContent = msgNow.t; el.classList.toggle('ok', msgNow.ok); }
}

async function addFriend() {
  const el = $('#findLogin'), login = el.value.trim();
  if (!login) return;
  if (!LOGIN_RE.test(login)) return say('Логин: 3–16 знаков, латиница, цифры, _');
  say('');
  try {
    const r = await sendFriendRequest(me, myLogin, login);
    el.value = '';
    say(r === 'friends' ? 'Теперь вы друзья' : 'Заявка отправлена', true);
  } catch (e) { say(errText(e)); }
}

function askPet(f) {
  asking = f;
  $('#noteWho').textContent = nameOf(f);
  note.hidden = false;
}
$('#noteNo').addEventListener('click', () => { note.hidden = true; asking = null; });
$('#noteOk').addEventListener('click', async () => {
  const f = asking;
  note.hidden = true; asking = null;
  if (!f) return;
  try {
    const r = await invitePet(me, myLogin, other(f), nameOf(f));
    if (r === 'created') location.replace('pet.html');
    else say('Приглашение отправлено для ' + nameOf(f), true);
  } catch (e) { say(errText(e)); }
});

body.addEventListener('click', async (e) => {
  if (e.target.closest('#toPet')) { location.href = 'pet.html'; return; }
  if (e.target.closest('#findBtn')) { addFriend(); return; }
  const b = e.target.closest('button[data-act]');
  if (!b || busy) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'petAsk') { askPet(lobby.friends[i]); return; }
  busy = true; b.disabled = true;
  try {
    if (act === 'accept') await acceptFriend(lobby.incoming[i]);
    else if (act === 'decline') await dropFriendRequest(lobby.incoming[i]);
    else if (act === 'cancel') await dropFriendRequest(lobby.outgoing[i]);
    else if (act === 'petNo') await dropPetInvite(lobby.petIn[i]);
    else if (act === 'petCancel') { const v = lobby.petOut.find((x) => x.to === b.dataset.u); if (v) await dropPetInvite(v); }
    else if (act === 'petYes') { await acceptPet(lobby.petIn[i]); location.replace('pet.html'); return; }
  } catch (err) { say(errText(err)); b.disabled = false; }
  busy = false;
});
body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'findLogin') { e.preventDefault(); addFriend(); } });

$('#out').addEventListener('click', () => leave().then(() => location.replace('index.html')));

if (!CONFIGURED) {
  body.className = '';
  body.innerHTML = '<p class="empty">Сайт ещё не подключён к серверу.</p>';
} else {
  onAuth((user) => {
    if (!user) { location.replace('index.html'); return; }
    if (me) return;
    me = user.uid; myLogin = loginOf(user);
    $('#me').textContent = myLogin;
    watchMyPet(me, (id) => { if (id) { location.replace('pet.html'); return; } petId = id; render(); });
    watchLobby(me, (st) => {
      lobby = st;
      render();
      const uids = st.friends.map(other).filter(Boolean);
      if (uids.length) petOwners(uids).then((o) => { owners = o; render(); });
    });
  });
}
</script>
</body>
</html>
