:root{
  /* Layout: the same card as before — a live "together for" clock on top, the next anniversary below, then milestones. Everything on a 2px pixel grid. */
  --ground:#ffe9f0; --paper:#fff6f9; --ink:#5a2a3c; --ink2:#8e5470; --rose:#ff6f9c; --rose2:#e64f7e; --rose0:#ffd3e0;
  --p:2px; --f1:15px; --f2:20px; --f3:30px; --f4:40px;
  --font:'Px',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--ground)}
body{background:transparent;color:var(--ink);font:var(--f2)/1.2 var(--font);font-synthesis:none;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
h1,h2,b,strong{font-weight:400}
.pi{display:block;flex:none}
.pb{--bc:var(--ink);--bg:#fff;--ds:rgba(90,42,60,.2);background:var(--bg);box-shadow:0 calc(var(--p) * -1) 0 0 var(--bc),0 var(--p) 0 0 var(--bc),calc(var(--p) * -1) 0 0 0 var(--bc),var(--p) 0 0 0 var(--bc),0 calc(var(--p) * 2) 0 0 var(--ds)}
.pb2{--bc:var(--ink);--bg:#fff;--ds:rgba(90,42,60,.2);background:linear-gradient(var(--bc),var(--bc)) 0 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 0 100%/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--p) var(--p) no-repeat,var(--bg);box-shadow:0 calc(var(--p) * -2) 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 2) 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * -2) 0 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * 2) 0 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 4) 0 calc(var(--p) * -1) var(--ds)}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:conic-gradient(#ffe2eb 25%,#ffe9f0 0 50%,#ffe2eb 0 75%,#ffe9f0 0) 0 0/24px 24px}
.fl{position:absolute;bottom:-40px;animation:rise linear infinite}
.fl .pi{animation:sway 4s steps(4,end) infinite alternate}
@keyframes rise{to{transform:translate3d(0,calc(-100vh - 90px),0)}}
@keyframes sway{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.card{--bc:#ef9cbb;--bg:var(--paper);--ds:rgba(230,79,126,.22);position:relative;z-index:1;width:100%;max-width:430px;padding:30px 18px 30px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;align-self:flex-start}
.head{display:flex;flex-direction:column;align-items:center;gap:10px}
.heart{animation:beat 1.3s steps(1,end) infinite}
@keyframes beat{0%,30%,100%{transform:none}15%,45%{transform:translateY(calc(var(--p) * -2))}}
h1{margin:6px 0 0;font-size:var(--f4);line-height:1}
.since{margin:0;font-size:var(--f1);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;padding:0 2px}
.tile{padding:14px 4px 12px}
.tile b{display:block;font-size:var(--f4);line-height:1;color:var(--rose2)}
.tile span{display:block;margin-top:8px;font-size:var(--f1);line-height:1;color:var(--ink2)}
.tile.tick b{animation:tick .3s steps(1,end)}
@keyframes tick{0%{transform:translateY(calc(var(--p) * -2))}50%{transform:none}}
.totals{margin:-8px 0 0;font-size:var(--f1);line-height:1.6;color:var(--ink2)}
.totals b{color:var(--ink)}
.box{--bg:#fff;width:100%;padding:16px 16px 18px;text-align:left}
.box h2{margin:0 0 8px;font-size:var(--f2);line-height:1}
.next-left{margin:0 0 14px;font-size:var(--f1);line-height:1.3;color:var(--ink2)}
.meter{height:14px;background:#ffe3ec}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--rose) 0 8px,#ff8db0 8px 10px);box-shadow:inset 0 var(--p) 0 0 rgba(255,255,255,.4),inset 0 calc(var(--p) * -1) 0 0 rgba(170,30,85,.25)}
.pct{display:flex;justify-content:space-between;gap:6px;margin-top:10px;font-size:var(--f1);line-height:1;color:var(--ink2)}
ul{list-style:none;margin:14px 0 0;padding:0 2px;display:flex;flex-direction:column;gap:14px}
li{--bg:#fff;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic nm" "ic sub";align-items:center;gap:6px 12px;padding:9px 10px}
li .pi{grid-area:ic;color:#ffb6cb}
li.done .pi{color:var(--rose)}
li strong{grid-area:nm;min-width:0;line-height:1.1}
li .sub{grid-area:sub;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px}
li small{font-size:var(--f1);line-height:1;color:var(--ink2);white-space:nowrap}
li em{margin-left:auto;font-style:normal;font-size:var(--f1);line-height:1;color:var(--rose2);background:var(--rose0);padding:4px 6px 5px;white-space:nowrap}
li.done em{background:var(--rose);color:#fff}
.foot{margin:0;display:flex;align-items:center;gap:8px;font-size:var(--f2);color:var(--rose2)}
.foot .pi{color:var(--rose)}
@media (max-width:370px){.grid{gap:10px}.tile b{font-size:var(--f3)}}
@media (prefers-reduced-motion:reduce){.fl,.fl .pi,.heart{animation:none}}
</style>
</head>

  <section class="grid" aria-label="Сколько мы вместе" aria-live="off">
    <div class="tile pb"><b id="y">0</b><span id="yL">лет</span></div>
    <div class="tile pb"><b id="mo">0</b><span id="moL">месяцев</span></div>
    <div class="tile pb"><b id="d">0</b><span id="dL">дней</span></div>
    <div class="tile pb"><b id="h">0</b><span id="hL">часов</span></div>
    <div class="tile pb"><b id="mi">0</b><span id="miL">минут</span></div>
    <div class="tile pb" id="sTile"><b id="s">0</b><span id="sL">секунд</span></div>
  </section>

  <p class="totals">Это уже <b id="tDays">0</b> <span id="tDaysL">дней</span>,<br><b id="tHours">0</b> <span id="tHoursL">часов</span> или <b id="tMin">0</b> <span id="tMinL">минут</span></p>

  <section class="box pb2">
    <h2 id="nextTitle">До 3 лет</h2>
    <p class="next-left" id="nextLeft">…</p>
    <div class="meter pb"><i id="bar"></i></div>
    <div class="pct"><span id="from">4 окт 2026</span><span id="pct">0%</span><span id="to">4 окт 2027</span></div>
  </section>

  <section class="box pb2">
    <h2>Наши рубежи</h2>
    <ul id="ms"></ul>
  </section>

  <p class="foot">и это только начало <svg class="pi" viewBox="0 0 9 8" width="18" height="16" shape-rendering="crispEdges" aria-label="💗" role="img"><use href="#hf"/></svg></p>
</main>

<script>
(() => {
'use strict';
/* Начало отношений: 4 октября 2024, 19:00 по Москве (UTC+3) */
const START = Date.UTC(2024, 9, 4, 16, 0, 0);
const MSK = 3 * 3600e3;
const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat('ru-RU');
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b > 1 && b < 5 ? few : many; };
const W = {
  y: ['год', 'года', 'лет'], mo: ['месяц', 'месяца', 'месяцев'], d: ['день', 'дня', 'дней'],
  h: ['час', 'часа', 'часов'], mi: ['минута', 'минуты', 'минут'], s: ['секунда', 'секунды', 'секунд'],
};
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_FULL = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
// work in Moscow wall-clock time, expressed through UTC getters
const msk = (t) => new Date(t + MSK);
const fromMsk = (y, m, d, h, mi, s) => Date.UTC(y, m, d, h || 0, mi || 0, s || 0) - MSK;
const s0 = msk(START);
const addYears = (n) => fromMsk(s0.getUTCFullYear() + n, s0.getUTCMonth(), s0.getUTCDate(), s0.getUTCHours());
const fmtDate = (t, full) => { const d = msk(t); return d.getUTCDate() + ' ' + (full ? MONTHS_FULL : MONTHS)[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };

function diff(now) {
  const a = msk(START), b = msk(now);
  let y = b.getUTCFullYear() - a.getUTCFullYear(), mo = b.getUTCMonth() - a.getUTCMonth(), d = b.getUTCDate() - a.getUTCDate();
  let h = b.getUTCHours() - a.getUTCHours(), mi = b.getUTCMinutes() - a.getUTCMinutes(), s = b.getUTCSeconds() - a.getUTCSeconds();
  if (s < 0) { s += 60; mi--; } if (mi < 0) { mi += 60; h--; } if (h < 0) { h += 24; d--; }
  if (d < 0) { const prevMonthDays = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), 0)).getUTCDate(); d += prevMonthDays; mo--; }
  if (mo < 0) { mo += 12; y--; }
  return { y, mo, d, h, mi, s };
}

const set = (id, n, words) => { const el = $(id); const t = String(n); if (el.textContent !== t) el.textContent = t; $(id + 'L').textContent = plural(n, ...words); };

// milestones
const DAY = 864e5;
const MILESTONES = [
  { t: START + 100 * DAY, name: '100 дней' },
  { t: addYears(1), name: '1 год' },
  { t: START + 500 * DAY, name: '500 дней' },
  { t: START + 1e6 * 60e3, name: '1 000 000 минут' },
  { t: addYears(2), name: '2 года' },
  { t: START + 1000 * DAY, name: '1000 дней' },
  { t: addYears(3), name: '3 года' },
  { t: START + 1e8 * 1e3, name: '100 000 000 секунд' },
  { t: addYears(5), name: '5 лет' },
  { t: START + 2000 * DAY, name: '2000 дней' },
].sort((p, q) => p.t - q.t);

function renderMilestones(now) {
  const html = MILESTONES.map((m) => {
    const done = now >= m.t;
    let tag;
    if (done) tag = 'есть!';
    else { const days = Math.ceil((m.t - now) / DAY); tag = 'через ' + nf.format(days) + ' ' + plural(days, 'день', 'дня', 'дней'); }
    return '<li class="pb' + (done ? ' done' : '') + '"><svg class="pi" viewBox="0 0 9 8" width="18" height="16" shape-rendering="crispEdges" aria-hidden="true"><use href="#' + (done ? 'hf' : 'ho') + '"/></svg><strong>' + m.name + '</strong><div class="sub"><small>' + fmtDate(m.t, true) + '</small><em>' + tag + '</em></div></li>';
  }).join('');
  const ul = $('ms'); if (ul.innerHTML !== html) ul.innerHTML = html;
}

let lastS = -1;
function tick() {
  const now = Date.now();
  const r = diff(now);
  set('y', r.y, W.y); set('mo', r.mo, W.mo); set('d', r.d, W.d); set('h', r.h, W.h); set('mi', r.mi, W.mi); set('s', r.s, W.s);
  if (r.s !== lastS) { const t = $('sTile'); t.classList.remove('tick'); void t.offsetWidth; t.classList.add('tick'); lastS = r.s; }
  const ms = now - START;
  const days = Math.floor(ms / DAY), hours = Math.floor(ms / 36e5), mins = Math.floor(ms / 6e4);
  $('tDays').textContent = nf.format(days); $('tDaysL').textContent = plural(days, 'день', 'дня', 'дней');
  $('tHours').textContent = nf.format(hours); $('tHoursL').textContent = plural(hours, 'час', 'часа', 'часов');
  $('tMin').textContent = nf.format(mins); $('tMinL').textContent = plural(mins, 'минуту', 'минуты', 'минут');
  // next anniversary
  const n = r.y + 1, prev = addYears(r.y), next = addYears(n);
  $('nextTitle').textContent = 'До ' + n + ' ' + plural(n, 'года', 'лет', 'лет');
  const left = next - now, ld = Math.floor(left / DAY), lh = Math.floor((left % DAY) / 36e5), lm = Math.floor((left % 36e5) / 6e4);
  $('nextLeft').textContent = 'осталось ' + ld + ' ' + plural(ld, 'день', 'дня', 'дней') + ' ' + lh + ' ' + plural(lh, 'час', 'часа', 'часов') + ' ' + lm + ' ' + plural(lm, 'минута', 'минуты', 'минут');
  const p = (now - prev) / (next - prev);
  $('bar').style.width = (p * 100).toFixed(2) + '%';
  $('pct').textContent = (p * 100).toFixed(1).replace('.', ',') + '%';
  $('from').textContent = fmtDate(prev); $('to').textContent = fmtDate(next);
  renderMilestones(now);
}
tick();
setInterval(tick, 1000);

// floating hearts
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const cols = ['#ffb3c9', '#ff9dbb', '#ffc9d8', '#ffd2c2', '#f3c6f0']; let h = '';
  for (let i = 0; i < 12; i++) { const s = [2, 2, 3, 3, 4][i % 5], d = 16 + Math.random() * 14;
    h += '<i class="fl" style="left:' + (Math.random() * 95).toFixed(1) + '%;opacity:' + (.4 + Math.random() * .4).toFixed(2) + ';animation-duration:' + d.toFixed(1) + 's;animation-delay:' + (-Math.random() * d).toFixed(1) + 's"><svg class="pi" viewBox="0 0 9 8" width="' + 9 * s + '" height="' + 8 * s + '" shape-rendering="crispEdges" style="color:' + cols[i % 5] + '"><use href="#hf"/></svg></i>'; }
  $('bg').innerHTML = h;
}
})();
</script>
</body>
</html>
