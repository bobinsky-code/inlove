  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((r) => r.forEach((x) => x.unregister())); } catch (e) { /* ignore */ }

}</script>

:root{
  --ground:#ffe9f0; --paper:#fff6f9; --ink:#5a2a3c; --ink2:#8e5470; --rose:#ff6f9c; --rose2:#e64f7e; --rose0:#ffd3e0;
  --p:2px; --f1:15px; --f2:20px; --f4:40px;
  --font:'Px',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:conic-gradient(#ffe2eb 25%,#ffe9f0 0 50%,#ffe2eb 0 75%,#ffe9f0 0) 0 0/24px 24px;color:var(--ink);font:var(--f2)/1.2 var(--font);font-synthesis:none;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
h1,b{font-weight:400}
.pb2{--bc:var(--ink);--bg:#fff;--ds:rgba(90,42,60,.2);background:linear-gradient(var(--bc),var(--bc)) 0 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 0 100%/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--p) var(--p) no-repeat,var(--bg);box-shadow:0 calc(var(--p) * -2) 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 2) 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * -2) 0 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * 2) 0 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 4) 0 calc(var(--p) * -1) var(--ds)}
.pb{--bc:var(--ink);--bg:#fff;--hi:transparent;--sh:transparent;--ds:rgba(90,42,60,.2);background:var(--bg);box-shadow:0 calc(var(--p) * -1) 0 0 var(--bc),0 var(--p) 0 0 var(--bc),calc(var(--p) * -1) 0 0 0 var(--bc),var(--p) 0 0 0 var(--bc),0 calc(var(--p) * 2) 0 0 var(--ds),inset 0 var(--p) 0 0 var(--hi),inset 0 calc(var(--p) * -2) 0 0 var(--sh)}
.card{--bc:#ef9cbb;--bg:var(--paper);--ds:rgba(230,79,126,.22);width:100%;max-width:380px;padding:30px 24px 30px}
h1{margin:0 0 22px;text-align:center;font-size:var(--f4);line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:0 0 22px}
.tg{min-width:0;padding:11px 0 12px;border:0;border-radius:0;background:none;color:var(--ink2);font:var(--f1)/1 var(--font);cursor:pointer;box-shadow:inset var(--p) 0 0 0 var(--ink)}
.tg:first-child{box-shadow:none}
.tg.is-on{background:var(--rose0);color:var(--rose2)}
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:8px;font-size:var(--f1);line-height:1;color:var(--ink2)}
input{width:100%;height:46px;padding:0 12px;border:0;border-radius:0;font:var(--f2)/1 var(--font);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
input:focus{--bc:var(--rose2)}
.err input{--bc:var(--rose2);--bg:#fff0f4}
.hint{margin:-8px 0 0;font-size:var(--f1);line-height:1.3;color:var(--ink2)}
.msg{min-height:15px;margin:-4px 0 0;font-size:var(--f1);line-height:1.3;color:var(--rose2);text-align:center}
button.go{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);height:48px;margin-top:4px;border:0;border-radius:0;padding:0 0 2px;color:#fff;font:var(--f2)/1 var(--font);text-shadow:0 var(--p) 0 rgba(170,30,85,.4);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button.go:active{transform:translateY(var(--p));--ds:transparent}
button.go:disabled{opacity:.7}
.shake{animation:shake .36s steps(1,end)}
@keyframes shake{0%,50%{transform:translateX(calc(var(--p) * -3))}25%,75%{transform:translateX(calc(var(--p) * 3))}}
:focus-visible{outline:var(--p) dashed var(--rose2);outline-offset:calc(var(--p) * 3)}
</style>
</head>
<body>
<main class="card pb2" id="card">
  <h1 id="title">Вход</h1>

  <div class="tabs pb" id="tabs">
    <button class="tg is-on" type="button" data-mode="in">Вход</button>
    <button class="tg" type="button" data-mode="up">Регистрация</button>
  </div>

  <form id="form" novalidate>
    <label>Логин<input class="pb" id="login" name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="16" required></label>
    <p class="hint only-up" hidden>3–16 знаков: латинские буквы, цифры, _</p>
    <label>Пароль<input class="pb" id="password" name="password" type="password" autocomplete="current-password" required></label>
    <label class="only-up" hidden>Повтор пароля<input class="pb" id="password2" type="password" autocomplete="new-password"></label>
    <p class="msg" id="msg" role="alert"></p>
    <button class="pb go" type="submit" id="btn">Войти</button>
  </form>
</main>

<script type="module">
import { CONFIGURED, LOGIN_RE, authReady, register, signIn, errText } from './fb.js';
'use strict';
const $ = (s) => document.querySelector(s);
const form = $('#form'), msg = $('#msg'), btn = $('#btn'), card = $('#card'), title = $('#title');
let mode = 'in';

function fail(text) {
  msg.textContent = text; form.classList.add('err');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.tg').forEach((t) => t.classList.toggle('is-on', t.dataset.mode === m));
  document.querySelectorAll('.only-up').forEach((el) => { el.hidden = m !== 'up'; });
  title.textContent = m === 'up' ? 'Регистрация' : 'Вход';
  btn.textContent = m === 'up' ? 'Создать аккаунт' : 'Войти';
  $('#password').setAttribute('autocomplete', m === 'up' ? 'new-password' : 'current-password');
  msg.textContent = ''; form.classList.remove('err');
  document.title = title.textContent;
}
$('#tabs').addEventListener('click', (e) => { const t = e.target.closest('.tg'); if (t) setMode(t.dataset.mode); });
form.addEventListener('input', () => { msg.textContent = ''; form.classList.remove('err'); });

function go(fresh) { location.replace(fresh ? 'app.html' : 'pet.html'); }

if (!CONFIGURED) {
  form.hidden = true; $('#tabs').hidden = true;
  msg.textContent = 'Сайт ещё не подключён к серверу';
} else {
  authReady().then((u) => { if (u) go(); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const login = $('#login').value.trim(), pass = $('#password').value;
    if (!login || !pass) return fail('Введите логин и пароль');
    if (!LOGIN_RE.test(login)) return fail('Логин: 3–16 знаков, латиница, цифры, _');
    if (mode === 'up') {
      if (pass.length < 6) return fail('Пароль короче 6 знаков');
      if (pass !== $('#password2').value) return fail('Пароли не совпадают');
    }
    btn.disabled = true;
    try {
      const fresh = mode === 'up';                     /* у нового аккаунта питомца ещё нет */
      if (fresh) await register(login, pass); else await signIn(login, pass);
      go(fresh);
    } catch (err) {
      fail(errText(err));
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
