:root{
  /* Layout: the phone-game screen as before — name, level and coins on top, care meters, the room (one pixel canvas, rooms slide sideways), the room's actions, room tabs at the bottom. UI sits on a 2px grid; the room uses its own chunkier pixel grid. */
  --ground:#ffe9f0; --paper:#fff6f9; --ink:#5a2a3c; --ink2:#8e5470; --rose:#ff6f9c; --rose2:#e64f7e; --rose0:#ffd3e0; --rose1:#ffb3c9;
  --c-food:#ff8a5c; --c-fun:#ff6f9c; --c-energy:#f2a51e; --c-clean:#5f9cf5;
  --p:2px; --f1:15px; --f2:20px; --f3:30px;
  --font:'Px',ui-monospace,Menlo,Consolas,monospace;
  --app-h:100vh;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{overflow:hidden;background:var(--ground)}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:conic-gradient(#ffe2eb 25%,#ffe9f0 0 50%,#ffe2eb 0 75%,#ffe9f0 0) 0 0/24px 24px;color:var(--ink);font:var(--f2)/1.2 var(--font);font-synthesis:none;-webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
b,strong,h1,h2,h3{font-weight:400}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;border-radius:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
:focus{outline:none}
:focus-visible{outline:var(--p) dashed var(--rose2);outline-offset:calc(var(--p) * 3)}
.pi{display:block;flex:none;overflow:visible}

/* ---------- pixel boxes: 1-step (.pb) and 2-step (.pb2) corners, drawn outside the box ---------- */
.pb{--bc:var(--ink);--bg:#fff;--hi:transparent;--sh:transparent;--ds:rgba(90,42,60,.2);background:var(--bg);box-shadow:0 calc(var(--p) * -1) 0 0 var(--bc),0 var(--p) 0 0 var(--bc),calc(var(--p) * -1) 0 0 0 var(--bc),var(--p) 0 0 0 var(--bc),0 calc(var(--p) * 2) 0 0 var(--ds),inset 0 var(--p) 0 0 var(--hi),inset 0 calc(var(--p) * -2) 0 0 var(--sh)}
.pb2{--bc:var(--ink);--bg:#fff;--ds:rgba(90,42,60,.2);background:linear-gradient(var(--bc),var(--bc)) 0 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 0/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 0 100%/var(--p) var(--p) no-repeat,linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--p) var(--p) no-repeat,var(--bg);box-shadow:0 calc(var(--p) * -2) 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 2) 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * -2) 0 0 calc(var(--p) * -1) var(--bc),calc(var(--p) * 2) 0 0 calc(var(--p) * -1) var(--bc),0 calc(var(--p) * 4) 0 calc(var(--p) * -1) var(--ds)}
.press:active{transform:translateY(var(--p));--ds:transparent}

/* ---------- frame ---------- */
.app{position:fixed;left:0;top:0;width:100%;height:var(--app-h);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.stage{--bc:#ef9cbb;--bg:var(--paper);--ds:rgba(230,79,126,.22);position:relative;width:100%;height:100%;max-width:440px;max-height:900px;display:flex;flex-direction:column;gap:12px;padding:12px 12px 14px;overflow:hidden;isolation:isolate}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;height:36px;padding:0 2px}
.name{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.name b{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip}
.name .pi{color:var(--ink2)}
.name input{width:100%;min-width:0;height:28px;border:0;border-radius:0;padding:0;background:transparent;font:var(--f2)/1 var(--font);color:var(--ink)}
.lvl{flex:none;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:0 9px}
.lvl b{font-size:var(--f1);line-height:1;color:var(--rose2);white-space:nowrap}
.xp{width:36px;height:6px;background:#ffe0ea;box-shadow:0 calc(var(--p) * -1) 0 0 var(--ink),0 var(--p) 0 0 var(--ink),calc(var(--p) * -1) 0 0 0 var(--ink),var(--p) 0 0 0 var(--ink)}
.xp i{display:block;width:0;height:100%;background:var(--rose);box-shadow:inset 0 var(--p) 0 0 rgba(255,255,255,.45)}
.coins{flex:none;height:100%;display:flex;align-items:center;gap:6px;padding:0 9px 0 8px}
.snd{flex:none;width:36px;height:100%;display:grid;place-items:center;color:var(--rose2)}
.snd .ic-off,.snd[aria-pressed="false"] .ic-on{display:none}
.snd[aria-pressed="false"] .ic-off{display:block}

/* ---------- meters ---------- */
.stats{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:2px 4px 0}
.stat{display:flex;align-items:center;gap:10px;min-width:0}
.st-ic{--bg:var(--tint);flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--c)}
.st-b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.st-b span{font-size:var(--f1);line-height:1;color:var(--ink2);white-space:nowrap;overflow:hidden}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--p);height:10px}
.seg i{background:#f4dde6;box-shadow:inset 0 calc(var(--p) * -1) 0 0 rgba(90,42,60,.1)}
.seg i.on{background:var(--c);box-shadow:inset 0 var(--p) 0 0 rgba(255,255,255,.4),inset 0 calc(var(--p) * -1) 0 0 rgba(90,42,60,.22)}
.stat.is-low .seg i.on{animation:blink 1s steps(1,end) infinite}
.stat.is-low .st-ic{animation:nudge 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.3}}
@keyframes nudge{50%{transform:translateY(calc(var(--p) * -1))}}
.stat[data-k="food"]{--c:var(--c-food);--tint:#ffe6dc} .stat[data-k="fun"]{--c:var(--c-fun);--tint:#ffe1ea} .stat[data-k="energy"]{--c:var(--c-energy);--tint:#fff1d2} .stat[data-k="clean"]{--c:var(--c-clean);--tint:#e2eeff}
.float{position:fixed;left:0;top:0;z-index:70;pointer-events:none;font-size:var(--f2);line-height:1;white-space:nowrap;color:var(--rose2);text-shadow:var(--p) 0 #fff,calc(var(--p) * -1) 0 #fff,0 var(--p) #fff,0 calc(var(--p) * -1) #fff,var(--p) var(--p) #fff,calc(var(--p) * -1) var(--p) #fff,var(--p) calc(var(--p) * -1) #fff,calc(var(--p) * -1) calc(var(--p) * -1) #fff;animation:float 1.1s steps(10,end) forwards}
@keyframes float{0%{transform:translate(-50%,-30%);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-190%);opacity:0}}

/* ---------- scene (one canvas) ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
.scene canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.toast{--bg:#fff;position:absolute;left:50%;top:62px;z-index:60;padding:7px 14px;color:var(--rose2);white-space:nowrap;opacity:0;transform:translate(-50%,-8px);transition:opacity .2s steps(2,end),transform .2s steps(2,end);pointer-events:none}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ---------- panel ---------- */
.panel{flex:none;position:relative;height:118px}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;visibility:hidden}
.pane.is-on{visibility:visible;animation:paneIn .24s steps(3,end)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
.btn{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 20px 2px;color:#fff;text-shadow:0 var(--p) 0 rgba(170,30,85,.4)}
.btn--ghost{--bg:#fff;--hi:transparent;--sh:rgba(90,42,60,.08);color:var(--rose2);text-shadow:none}
.hint{margin:0;max-width:36ch;font-size:var(--f1);line-height:1.35;color:var(--ink2);text-align:center}
.foods{display:flex;gap:14px;width:100%;overflow-x:auto;padding:4px 6px 8px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.foods::-webkit-scrollbar{display:none}
.food{flex:0 0 auto;width:86px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px 6px;scroll-snap-align:start}
.food .fi{display:block;image-rendering:pixelated}
.food b{font-size:var(--f1);line-height:1}
.eff{display:flex;justify-content:center;gap:6px;font-size:var(--f1);line-height:1}
.eff span{display:inline-flex;align-items:center;gap:3px}
.price{display:inline-flex;align-items:center;gap:4px;font-size:var(--f1);line-height:1;color:var(--ink)}
.food.is-locked{opacity:.55}
.is-nope{animation:nope .36s steps(1,end)}
@keyframes nope{0%,50%{transform:translateX(calc(var(--p) * -2))}25%,75%{transform:translateX(calc(var(--p) * 2))}}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;padding:0 4px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:9px 11px 11px;text-align:left}
.gcard b{font-size:var(--f1);line-height:1.1}
.gcard small{font-size:var(--f1);color:var(--ink2)}
.gcard .go{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);--ds:transparent;margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:4px 9px 6px;color:#fff;font-size:var(--f1);line-height:1}
.gcard .go i{display:inline-flex;align-items:center;gap:2px;font-style:normal}

/* ---------- tabs ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);margin:0 2px 4px}
.tab{min-width:0;display:grid;grid-template-rows:20px auto;justify-items:center;align-items:center;gap:5px;padding:7px 0 7px;color:var(--ink2);font-size:var(--f1);line-height:1;white-space:nowrap;box-shadow:inset var(--p) 0 0 0 var(--ink)}
.tab:first-child{box-shadow:none}
.tab:active{background:#fff0f5}
.tab.is-on{background:var(--rose0);color:var(--rose2);box-shadow:inset var(--p) 0 0 0 var(--ink),inset 0 calc(var(--p) * 2) 0 0 rgba(90,42,60,.12)}
.tab.is-on:first-child{box-shadow:inset 0 calc(var(--p) * 2) 0 0 rgba(90,42,60,.12)}

/* ---------- shop ---------- */
.sheet-bg{position:absolute;inset:0;z-index:30;background:rgba(90,42,60,.32);opacity:0;visibility:hidden;transition:opacity .24s steps(3,end),visibility 0s linear .24s}
.sheet-bg.is-on{opacity:1;visibility:visible;transition:opacity .24s steps(3,end)}
.sheet{--bg:var(--paper);position:absolute;left:8px;right:8px;bottom:10px;z-index:31;max-height:86%;display:flex;flex-direction:column;transform:translate3d(0,calc(100% + 40px),0);visibility:hidden;transition:transform .32s steps(5,end),visibility 0s linear .32s}
.sheet.is-on{transform:none;visibility:visible;transition:transform .32s steps(5,end)}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 6px 16px}
.sheet-h h2{margin:0;font-size:var(--f3);line-height:1}
.x{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
.sheet-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 14px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{margin:6px 2px -2px;font-size:var(--f1);color:var(--ink2)}
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:8px 10px}
.th{flex:none;width:58px;height:58px;display:grid;place-items:center;background:#fff1f6;box-shadow:inset 0 0 0 var(--p) #ffe0ea}
.th img{display:block;image-rendering:pixelated}
.tx{flex:1 1 auto;min-width:0}
.tx b{display:block;line-height:1.1}
.tx small{display:block;margin-top:3px;font-size:var(--f1);line-height:1.2;color:var(--ink2)}
.buy{--bg:var(--rose);--hi:rgba(255,255,255,.42);--sh:rgba(170,30,85,.28);--ds:transparent;flex:none;display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 9px 2px;color:#fff;font-size:var(--f1);line-height:1}
.buy.is-owned{--bg:var(--rose0);--hi:transparent;--sh:transparent;color:var(--rose2)}
.buy.is-locked{--bg:#f3e8ed;--hi:transparent;--sh:transparent;--bc:#b9a3ae;color:#a08893}

/* ---------- games ---------- */
.game{position:absolute;inset:0;z-index:40;background:#ffeef4;overflow:hidden;clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.game canvas{position:absolute;left:0;top:0;display:block;width:100%;height:100%;touch-action:none}
.g-hud{position:absolute;left:16px;right:16px;top:16px;z-index:2;display:flex;align-items:center;gap:14px;pointer-events:none}
.g-pill{--bg:#fff;padding:6px 12px;color:var(--rose2);line-height:1}
.g-hud .x{margin-left:auto;pointer-events:auto}
.g-card{--bg:#fff;position:absolute;left:50%;top:50%;z-index:3;width:min(84%,320px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 18px 20px;text-align:center;transform:translate(-50%,-50%)}
.g-card h3{margin:0;font-size:var(--f3);line-height:1}
.g-card p{margin:0;font-size:var(--f1);line-height:1.4;color:var(--ink2)}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 18px;width:100%;margin:0}
.res dt{text-align:left;color:var(--ink2)}
.res dd{margin:0;text-align:right}
.g-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.g-actions .btn{min-height:42px;padding:0 16px 2px}

/* ---------- one-time note ---------- */
.note{position:absolute;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(90,42,60,.34);opacity:0;transition:opacity .36s steps(4,end)}
.note.is-on{opacity:1}
.note-card{--bg:#fff;width:min(100%,320px);display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 20px 20px;text-align:center;transform:translate3d(0,12px,0);transition:transform .36s steps(4,end)}
.note.is-on .note-card{transform:none}
.note-card p{margin:0;line-height:1.45;color:var(--ink);text-wrap:balance}

/* ---------- misc ---------- */
.fly{position:fixed;left:0;top:0;z-index:65;pointer-events:none}
.fly img{display:block;image-rendering:pixelated}
.fx{position:fixed;left:0;top:0;z-index:80;width:100%;height:100%;pointer-events:none}
.turn{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:var(--ground);color:var(--ink);text-align:center}
.turn .pi{color:var(--rose2);animation:turn 2.4s steps(1,end) infinite}
@keyframes turn{0%{transform:rotate(-90deg)}50%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.turn{display:flex}.app{visibility:hidden}}
@media (max-height:640px){.stats{gap:8px 14px}.st-b span{display:none}.st-ic{width:26px;height:26px}.panel{height:106px}.foods{padding:3px 6px 6px}.btn{min-height:40px}.top{height:34px}.stage{gap:10px}}
@media (max-width:372px){.app{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.stage{padding-left:8px;padding-right:8px}.top{gap:8px}}
@media (max-width:340px){.tab{font-size:10px}.stats{gap:8px 10px}}
@media (prefers-reduced-motion:reduce){.stat.is-low .seg i.on,.stat.is-low .st-ic{animation:none}}

      <button class="name pb press" id="nameBtn" type="button" aria-label="Имя питомца, нажми чтобы изменить"><b id="petName">Питомец</b><i data-ic="pencil"></i></button>
      <div class="lvl pb" id="lvlChip"><b id="lvlTx">Ур. 1</b><div class="xp"><i id="xpBar"></i></div></div>
      <div class="coins pb" id="coinsChip"><i data-ic="coin"></i><span id="coinsTx">0</span></div>
      <button class="snd pb press" id="snd" type="button" aria-pressed="true" aria-label="Выключить звук"><i class="ic-on" data-ic="sndOn"></i><i class="ic-off" data-ic="sndOff"></i></button>
    </header>

    <section class="stats" aria-label="Состояние питомца">

    </section>

    <section class="scene" id="scene" aria-label="Комната питомца">
      <canvas id="sceneCv" role="img" aria-label="Питомец"></canvas>
    </section>

    <section class="panel" aria-live="polite">
      <div class="pane" data-pane="0">
        <button class="btn pb press" id="shopBtn" type="button"><i data-ic="cart"></i>Магазин</button>
        <p class="hint">Нажми на питомца или погладь его</p>

      <div class="pane" data-pane="1">
        <div class="foods" id="foods"></div>
      </div>
      <div class="pane" data-pane="2">
        <p class="hint">Три пальцем по питомцу, потом смой пену</p>
        <button class="btn pb press" id="rinseBtn" type="button"><i data-ic="shower"></i>Смыть</button>
      </div>
      <div class="pane" data-pane="3">
        <button class="btn pb press" id="lightBtn" type="button"><i data-ic="bulb"></i><span id="lightTx">Выключить свет</span></button>
        <p class="hint" id="sleepHint">Во сне энергия +25 в час</p>
      </div>
      <div class="pane" data-pane="4">
        <div class="games">
          <button class="gcard pb press" type="button" data-game="catch"><b>Ловля косточек</b><small>Рекорд: <span data-best="catch">0</span></small><span class="go pb">Играть<i><i data-ic="bolt" data-s="1.5"></i>10</i></span></button>
          <button class="gcard pb press" type="button" data-game="run"><b>Прыжки</b><small>Рекорд: <span data-best="run">0</span></small><span class="go pb">Играть<i><i data-ic="bolt" data-s="1.5"></i>10</i></span></button>
        </div>
      </div>
    </section>

    <nav class="tabs pb" aria-label="Комнаты">
      <button class="tab" type="button" data-room="0"><i data-ic="sofa"></i>Комната</button>
      <button class="tab" type="button" data-room="1"><i data-ic="bowl"></i>Кухня</button>
      <button class="tab" type="button" data-room="2"><i data-ic="bath"></i>Ванная</button>
      <button class="tab" type="button" data-room="3"><i data-ic="moon"></i>Спальня</button>
      <button class="tab" type="button" data-room="4"><i data-ic="pad"></i>Игры</button>
    </nav>

    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet pb2" id="sheet" role="dialog" aria-label="Магазин" aria-modal="true">
      <div class="sheet-h"><h2>Магазин</h2><button class="x pb press" id="sheetX" type="button" aria-label="Закрыть"><i data-ic="close"></i></button></div>
      <div class="sheet-list" id="shopList"></div>
    </div>

    <div class="game" id="game" hidden>
      <canvas id="gameCv"></canvas>
      <div class="g-hud"><span class="g-pill pb" id="gScore">0</span><span class="g-pill pb" id="gTime" hidden>0:30</span><button class="x pb press" id="gX" type="button" aria-label="Закрыть"><i data-ic="close"></i></button></div>
      <div class="g-card pb2" id="gStart"><h3 id="gTitle"></h3><p id="gHow"></p><button class="btn pb press" id="gGo" type="button">Старт</button></div>
      <div class="g-card pb2" id="gEnd" hidden><h3>Результат</h3><dl class="res"><dt>Очки</dt><dd id="rScore">0</dd><dt>Рекорд</dt><dd id="rBest">0</dd><dt>Монеты</dt><dd id="rCoins">+0</dd></dl><div class="g-actions"><button class="btn pb press" id="gAgain" type="button">Ещё раз</button><button class="btn btn--ghost pb press" id="gExit" type="button">Выйти</button></div></div>
    </div>

    <div class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="noteText" hidden><div class="note-card pb2"><p id="noteText">Извини меня пожалуйста, я был не прав</p><button class="btn pb press" id="noteOk" type="button">Закрыть</button></div></div>
  </main>
</div>

<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<div class="turn" aria-hidden="true">
  <i data-ic="phone" data-s="4"></i>
  <p>Переверни телефон вертикально</p>
</div>

function drawRoomLive(ctx, i, lw, lh, ox, o, t) {

    const d = new Date(), cx = ox + P.clock[0] + 7, cy = P.clock[1] + 7;

/* ---------- top bar & meters ---------- */
const nameBtn = $('#nameBtn'), nameTx = $('#petName'), lvlTx = $('#lvlTx'), xpBar = $('#xpBar'), coinsTx = $('#coinsTx'), coinsChip = $('#coinsChip'), lvlChip = $('#lvlChip');
const STATS = {};

function renderTop() {

  lvlTx.textContent = 'Ур. ' + S.lvl;
  xpBar.style.width = Math.floor(Math.min(1, S.xp / needXP(S.lvl)) * 18) * 2 + 'px';
  coinsTx.textContent = String(S.coins);
}
function renderStats() {
  ['food', 'fun', 'energy', 'clean'].forEach((k) => {
    const s = STATS[k], n = S[k] <= 0 ? 0 : Math.min(10, Math.ceil(S[k] / 10 - 1e-9));
    if (n !== s.n) { s.n = n; s.segs.forEach((g, i) => g.classList.toggle('on', i < n)); }

}

    const r = STATS[k].ic.getBoundingClientRect();
    floatText(r.left + r.width / 2, r.top, (real > 0 ? '+' : '') + real, getComputedStyle(STATS[k].el).getPropertyValue('--c').trim() || null);
  }

}

  renderTop();
  const r = coinsChip.getBoundingClientRect();
  floatText(r.left + r.width / 2, r.top + r.height, (n > 0 ? '+' : '−') + Math.abs(n), '#d48a12');
  if (n > 0) Sound.coin();
  save();
}

  S.xp += n;
  let up = 0;
  while (S.xp >= needXP(S.lvl)) { S.xp -= needXP(S.lvl); S.lvl++; up++; }
  renderTop();
  if (up) levelUp();
  save();
}

  const reward = 20 + S.lvl * 5;
  toast('Уровень ' + S.lvl);
  Sound.levelUp(); Haptic.tap(30);
  const r = lvlChip.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 34, speed: 420, g: 300 });
  setTimeout(() => addCoins(reward), 500);
  renderFoods(); renderShop();
}

/* name */
nameBtn.addEventListener('click', () => {
  if ($('input', nameBtn)) return;
  const inp = document.createElement('input');
  inp.value = S.name; inp.maxLength = 16; inp.setAttribute('aria-label', 'Имя питомца');

/* ---------- rooms ---------- */
let room = -1;
const tabs = $$('.tab'), panes = $$('.pane');
function goRoom(i, instant) {
  i = clamp(i, 0, 4);
  if (i === room) return;
  if (S.sleeping && i !== 3) setSleep(false);
  const first = room === -1;
  room = i; S.room = i;
  if (instant || first) Scene.go(i, true);
  else { Scene.go(i); Pet.act('walk', 640); Sound.whoosh(); }
  tabs.forEach((t, k) => { t.classList.toggle('is-on', k === i); t.setAttribute('aria-current', k === i ? 'page' : 'false'); });
  panes.forEach((p, k) => p.classList.toggle('is-on', k === i));
  if (i !== 2) Scene.sponge(null);
  save();
}
tabs.forEach((t) => t.addEventListener('click', () => goRoom(+t.dataset.room)));
window.addEventListener('keydown', (e) => {
  if (!$('#game').hidden || sheetOpen || document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goRoom(room + 1);
  if (e.key === 'ArrowLeft') goRoom(room - 1);
});
function renderRooms() {
  Scene.refresh();
  $('#sleepHint').textContent = 'Во сне энергия +' + (S.owned.bed ? 35 : 25) + ' в час';
}

/* ---------- petting, washing, swiping ---------- */
let rub = null, sw = null, washGain = 0;
function petOnce(x, y, tap) {
  if (S.sleeping) return;
  const t = Date.now();
  if (t - S.petWin.t > 30 * 60e3) S.petWin = { t, n: 0 };
  FX.burst(x, y, { n: tap ? 7 : 3, speed: 150, g: -140, drag: 0.95, min: 8, max: 15, hearts: 1, colors: ['#ff7ea6', '#ff9dbb', '#e64f7e'], unit: Scene.px * 0.75 });
  Sound.boop();
  Pet.act(tap ? 'happy' : 'pet', tap ? 1150 : 950);
  if (S.petWin.n < 12) {
    S.petWin.n++;
    change('fun', 2);
    if (S.petWin.n % 2 === 0) addXP(1);
  }
}
function washAt(e) {
  if (!Scene.onPet(e)) return;
  const p = Scene.petLocal(e);
  Scene.addBubble(p.x, p.y);
  if (Math.random() < 0.35) Sound.bubble();
  if (S.clean < 100) {
    const before = S.clean;
    S.clean = Math.min(100, S.clean + 1.1);
    washGain += S.clean - before;
    if (washGain >= 6) { washGain -= 6; addXP(1); }
    renderStats(); save();
  }
}
sceneCv.addEventListener('pointerdown', (e) => {
  Sound.unlock();
  if (Scene.onPet(e)) {
    if (e.cancelable) e.preventDefault();
    try { sceneCv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    sw = null;
    rub = { x: e.clientX, y: e.clientY, d: 0, moved: 0 };
    if (room === 2 && !S.sleeping) { Scene.sponge(e); washAt(e); }
  } else {
    sw = { x: e.clientX, y: e.clientY };
    try { sceneCv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});

  if (!rub) return;
  const dist = Math.hypot(e.clientX - rub.x, e.clientY - rub.y);
  rub.x = e.clientX; rub.y = e.clientY; rub.moved += dist; rub.d += dist;
  if (room === 2) { if (!S.sleeping) Scene.sponge(e); while (rub.d > 16) { rub.d -= 16; if (!S.sleeping) washAt(e); } }
  else if (rub.d > 70) { rub.d = 0; petOnce(e.clientX, e.clientY, false); }
});
function endRub(e) {
  if (!rub) return;
  if (e.type === 'pointerup' && room !== 2 && rub.moved < 14) { petOnce(e.clientX, e.clientY, true); if (e.pointerType !== 'mouse') Haptic.tap(6); }
  if (room === 2) Scene.sponge(null);
  rub = null;
}
sceneCv.addEventListener('pointerup', (e) => {

  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) goRoom(room + (dx < 0 ? 1 : -1));
});
sceneCv.addEventListener('pointercancel', (e) => { sw = null; endRub(e); });
sceneCv.addEventListener('lostpointercapture', endRub);
sceneCv.addEventListener('contextmenu', (e) => e.preventDefault());

  if (f.price) addCoins(-f.price);

  const sx = Math.round(a.left + a.width / 2 - u.w / 2), sy = Math.round(a.top + a.height / 2 - u.h / 2);

  const fly = document.createElement('div'); fly.className = 'fly';
  fly.innerHTML = '<img src="' + u.src + '" style="width:' + u.w + 'px;height:' + u.h + 'px" alt="">';
  fly.style.transform = 'translate(' + sx + 'px,' + sy + 'px)';
  document.body.appendChild(fly);

      const mm = Scene.mouth();
      Scene.crumbs();
      FX.burst(mm.x, mm.y + 6, { n: 4, speed: 120, g: 600, min: 3, max: 6, hearts: 0, colors: ['#d6a06f', '#c98a5a', '#fff6ea'], unit: Scene.px * 0.75 });
    }, ms));
    setTimeout(() => {
      const mult = S.owned.bigbowl ? 1.25 : 1;

/* ---------- mini-games (pixel canvas) ---------- */
const Game = (() => {
  const wrap = $('#game'), cv = $('#gameCv'), cx = cv.getContext('2d');
  const buf = document.createElement('canvas'), g = buf.getContext('2d');
  const scoreEl = $('#gScore'), timeEl = $('#gTime'), startCard = $('#gStart'), endCard = $('#gEnd');
  const INFO = {
    catch: { title: 'Ловля косточек', how: 'Води пальцем влево и вправо, лови косточки. Золотая косточка — 3 очка. 30 секунд.' },
    run: { title: 'Прыжки', how: 'Нажимай на экран, чтобы прыгать. В воздухе можно прыгнуть ещё раз — так перепрыгнешь высокие и длинные препятствия. Косточки в воздухе — 5 очков.' },
  };
  let W = 0, H = 0, D = 1, k = 1, N = 3, gw = 0, gh = 0, U = 1, mode = 'catch', state = 'off', raf = 0, last = 0, score = 0, shake = 0;
  let px = 0, tx = 0, items = [], spawnT = 0, time = 0, caughtT = -1;

  function size() {

  function update(dt) {

        items.push({ x: rand(26 * k + 10, W - 26 * k - 10), y: -30, vy: lerp(170, 320, prog) * rand(0.85, 1.2) * k, gold: Math.random() < 0.1, r: rand(-1, 1), vr: rand(-3, 3) });

        const kind = r < 0.12 + hard * 0.2 ? 'tall' : r < 0.22 + hard * 0.36 ? 'long' : r < 0.62 + hard * 0.2 ? 'box' : 'bush';
        const w = kind === 'long' ? rand(78, 104) : kind === 'tall' ? rand(32, 40) : rand(28, 44);
        const h = kind === 'tall' ? rand(100, 128) : kind === 'long' ? rand(32, 46) : kind === 'box' ? rand(32, 62) : rand(26, 44);

  });

    L2.pts([[Math.round(w * 0.4), Math.round(h * 0.4)], [Math.round(w * 0.66), Math.round(h * 0.66)]], '#ff9fbd');
    L2.pts([[Math.round(w * 0.4), Math.round(h * 0.4) - 1], [Math.round(w * 0.66), Math.round(h * 0.66) - 1]], '#ffd0de');

    g.fillStyle = '#efbe8e'; g.fillRect(x + 1, y + 1, w - 2, h - 2);
    g.fillStyle = '#e2a874'; g.fillRect(x + Math.round(w * 0.4), y + 1, Math.max(1, Math.round(w * 0.2)), h - 2);

  function drawPet(xc, groundC, quarter, o) {

    const x = Lp(xc), y = Lp(groundC) - PH + 1;

  }

    else bands(['#fff4f8', '#ffeef4', '#ffe8f0', '#ffe2eb'], 0, gyp);
    const off = mode === 'run' ? dist * 0.08 : 0;
    decor.forEach((d0) => {

      for (let x = 0; x < gw; x++) {
        const xc = x * U, top = Lp(gy() - 46 * k - Math.sin((xc + hoff) / (90 * k)) * 22 * k);

      for (let x = 0; x < gw; x++) { const xc = x * U; g.fillRect(x, Lp(gy() - 46 * k - Math.sin((xc + hoff) / (90 * k)) * 22 * k), 1, 1); }
    }
    g.fillStyle = '#ffcadb'; g.fillRect(0, gyp, gw, gh - gyp);
    g.fillStyle = '#ffb3cb'; g.fillRect(0, gyp, gw, 2);
    g.fillStyle = '#ffdbe6'; g.fillRect(0, gyp + 2, gw, 1);
    if (mode === 'run') {

  function loop(now) {

    S.fun = clamp(S.fun + 14, 0, 100);

    mode = m;
    wrap.hidden = false; size();

  }
  function close() {

  }
  function jump() {

    if (mode === 'catch') { tx = clamp(point(e), 20, W - 20); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
    else jump();
  });
  cv.addEventListener('pointermove', (e) => { if (state === 'play' && mode === 'catch' && (e.buttons || e.pointerType !== 'mouse')) tx = clamp(point(e), 20, W - 20); });
  window.addEventListener('keydown', (e) => {
    if (wrap.hidden || state !== 'play') return;
    if (mode === 'run' && (e.code === 'Space' || e.key === 'ArrowUp') && !e.repeat) { e.preventDefault(); jump(); }
    if (mode === 'catch' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) tx = clamp(tx + (e.key === 'ArrowLeft' ? -60 : 60), 20, W - 20);
  });
  $('#gGo').addEventListener('click', begin);
  $('#gAgain').addEventListener('click', begin);
  $('#gExit').addEventListener('click', close);
  $('#gX').addEventListener('click', close);
  return { open, resize() { if (!wrap.hidden) { size(); if (state !== 'play') draw(); } } };
})();
function renderBest() { $$('[data-best]').forEach((s) => { s.textContent = String(S.best[s.dataset.best] || 0); }); }
$$('.gcard').forEach((c) => c.addEventListener('click', () => {
  if (S.energy < GAME_COST) { nope(c); toast('Мало энергии'); Sound.error(); return; }
  Sound.unlock(); Game.open(c.dataset.game);
}));

/* ---------- sound button, global ---------- */
const snd = $('#snd');
function syncSnd() { snd.setAttribute('aria-pressed', String(Sound.on)); snd.setAttribute('aria-label', Sound.on ? 'Выключить звук' : 'Включить звук'); }
snd.addEventListener('click', () => { Sound.unlock(); Sound.set(!Sound.on); syncSnd(); if (Sound.on) setTimeout(() => Sound.boop(), 60); });
syncSnd();
['pointerup', 'touchend', 'click', 'keydown'].forEach((t) => window.addEventListener(t, () => Sound.unlock(), { capture: true, passive: true }));
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => {
  simulate(Date.now());
  if (document.hidden) saveNow(); else renderStats();
  Sound.visible(!document.hidden);
});
window.addEventListener('pagehide', () => { simulate(Date.now()); saveNow(); });
let rz = 0;
function onResize() { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { sizeApp(); FX.resize(); Scene.size(); Game.resize(); }); }
window.addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 300));
if (window.ResizeObserver) new ResizeObserver(() => onResize()).observe(scene);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);

/* ---------- start ---------- */
renderTop(); renderFoods(); renderRooms(); renderBest();
Scene.size(); Scene.start();
if (S.sleeping) { S.sleeping = false; goRoom(3, true); setSleep(true); }
else goRoom(S.room || 0, true);
renderStats();
setInterval(() => { simulate(Date.now()); renderStats(); }, 1000);
setInterval(saveNow, 10000);

/* разовое уведомление для favie */
(() => {
  const NOTE_KEY = 'nam2-note-sorry-1';
  let user = '';
  try { user = (JSON.parse(localStorage.getItem('nam2-session') || 'null') || {}).u || ''; } catch (e) { /* ignore */ }
  let seen = false;
  try { seen = localStorage.getItem(NOTE_KEY) === '1'; } catch (e) { /* ignore */ }
  if (user !== 'favie' || seen) return;
  const note = $('#note');
  setTimeout(() => { note.hidden = false; void note.offsetWidth; note.classList.add('is-on'); try { localStorage.setItem(NOTE_KEY, '1'); } catch (e) { /* ignore */ } }, 700);
  $('#noteOk').addEventListener('click', () => { note.classList.remove('is-on'); setTimeout(() => { note.hidden = true; }, 400); });
})();
})();
</script>
</body>
