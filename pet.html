<style>
:root{
  /* Layout: a phone-game screen inside the site's rounded pink card: name and level on top, care meters, the pet's room in the middle (rooms slide sideways), the room's actions, room tabs at the bottom. */
  --ground:#ffe9f0; --rose:#ff7ea6; --rose-deep:#e64f7e; --ink:#57203d; --ink-soft:#8d5a74; --honey:#ffc978;
  --c-food:#ff9470; --c-fun:#ff6f9c; --c-energy:#f5b021; --c-clean:#6fa8ff;
  --font-display:'Comfortaa',ui-rounded,'Nunito',system-ui,sans-serif;
  --font-body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --app-h:100vh;
  --sky1:#9fd6ff; --sky2:#ffe4ef;
  color-scheme:light;
}
html.sky-eve{--sky1:#ff9e8c;--sky2:#ffd8e8}
html.sky-night{--sky1:#252052;--sky2:#5a4a90}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{overflow:hidden;background:var(--ground)}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:linear-gradient(168deg,#fff4f8 0%,#ffe7ef 45%,#ffd8e5 100%);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
:focus{outline:none}
:focus-visible{outline:3px solid rgba(230,79,126,.5);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- frame ---------- */
.app{position:fixed;left:0;top:0;width:100%;height:var(--app-h);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.stage{position:relative;width:100%;height:100%;max-width:440px;max-height:900px;display:flex;flex-direction:column;gap:9px;padding:11px;border-radius:30px;background:linear-gradient(180deg,#fffdfe 0%,#fff7fa 55%,#fff1f6 100%);box-shadow:0 0 0 1px rgba(255,160,192,.32),inset 0 1px 0 #fff,0 38px 80px -32px rgba(206,58,110,.42),0 16px 32px -18px rgba(206,58,110,.3);overflow:hidden;isolation:isolate}
.chip{background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(255,170,198,.38),0 6px 14px -10px rgba(206,58,110,.45)}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:6px;height:40px}
.name{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;text-align:left}
.name b{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--font-display);font-size:16px}
.name svg{flex:none;width:14px;height:14px;fill:var(--ink-soft);opacity:.65}
.name input{width:100%;min-width:0;height:30px;border:0;padding:0;background:transparent;font:700 16px var(--font-display);color:var(--ink)}
.lvl{flex:none;height:100%;display:flex;align-items:center;gap:7px;padding:0 10px}
.lvl b{font-family:var(--font-display);font-size:13px;color:var(--rose-deep);white-space:nowrap}
.xp{width:40px;height:7px;border-radius:99px;background:#ffe0ea;overflow:hidden}
.xp i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffa7c2,#ff6795);transition:width .5s var(--ease)}
.coins{flex:none;height:100%;display:flex;align-items:center;gap:5px;padding:0 10px 0 7px;font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.coins svg{width:21px;height:21px}
.snd{flex:none;width:36px;height:100%;display:grid;place-items:center;color:var(--rose-deep)}
.snd svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd .ic-off,.snd[aria-pressed="false"] .ic-on{display:none}
.snd[aria-pressed="false"] .ic-off{display:block}

/* ---------- meters ---------- */
.stats{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stat{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring{position:relative;width:46px;height:46px}
.ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:#fff;stroke:#ffe4ec;stroke-width:5}
.ring .fg{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .6s var(--ease)}
.ring .ic{position:absolute;left:50%;top:50%;width:21px;height:21px;transform:translate(-50%,-50%);fill:var(--c)}
.stat span{font-weight:800;font-size:11px;color:var(--ink-soft)}
.stat.is-low .ring{animation:low 1.1s ease-in-out infinite}
@keyframes low{50%{transform:scale(1.09)}}
.stat[data-k="food"]{--c:var(--c-food)} .stat[data-k="fun"]{--c:var(--c-fun)} .stat[data-k="energy"]{--c:var(--c-energy)} .stat[data-k="clean"]{--c:var(--c-clean)}
.float{position:fixed;left:0;top:0;z-index:70;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--rose-deep);text-shadow:0 1px 0 #fff,0 0 6px #fff;animation:float 1.2s var(--ease) forwards}
@keyframes float{0%{transform:translate(-50%,-30%) scale(.7);opacity:0}20%{transform:translate(-50%,-70%) scale(1.1);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}

/* ---------- scene ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;border-radius:24px;overflow:hidden;background:#ffe3ec;box-shadow:inset 0 0 0 1px rgba(255,170,198,.35);touch-action:none;isolation:isolate}
.rooms{position:absolute;left:0;top:0;width:500%;height:100%;display:flex;transform:translate3d(calc(var(--ri,0) * -20%),0,0);transition:transform .62s var(--ease)}
.room{position:relative;flex:0 0 20%;height:100%;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;bottom:30%}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%}
.board{position:absolute;left:0;right:0;bottom:30%;height:7px;margin-bottom:-3px;background:#fff7fa;box-shadow:0 3px 6px -2px rgba(150,40,80,.18)}
.itm{position:absolute;display:block;width:auto;overflow:visible}
.itm[data-item]{display:none}
.itm[data-item].is-owned{display:block}
.itm.is-new{animation:itemIn .8s var(--spring)}
@keyframes itemIn{from{opacity:0;scale:.6}}
.wp-pink{background:radial-gradient(rgba(255,255,255,.62) 2.2px,transparent 2.8px) 0 0/26px 26px,linear-gradient(#ffd3e2,#ffe5ee)}
.wp-mint{background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 12px,transparent 12px 28px),linear-gradient(#cdeee0,#e6f7ef)}
.wp-lilac{background:radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 0 0/22px 22px,radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px) 11px 11px/22px 22px,linear-gradient(#e2d8ff,#efe9ff)}
.wp-peach{background:repeating-linear-gradient(45deg,rgba(255,255,255,.42) 0 10px,transparent 10px 22px),linear-gradient(#ffd9c4,#ffe9dd)}
.floor--wood{background:repeating-linear-gradient(90deg,rgba(150,80,60,.09) 0 2px,transparent 2px 64px),linear-gradient(#f2c6a8,#e8b293)}
.wall--kitchen{background:linear-gradient(#fff3ee,#fff3ee) 0 0/100% 46% no-repeat,conic-gradient(#fff 25%,#ffdfe9 0 50%,#fff 0 75%,#ffdfe9 0) 0 0/26px 26px}
.floor--kitchen{background:linear-gradient(rgba(150,60,90,.06),rgba(150,60,90,0)),conic-gradient(#ffd0de 25%,#fff4f7 0 50%,#ffd0de 0 75%,#fff4f7 0) 0 0/46px 46px}
.wall--bath{background:linear-gradient(#f4f1ff,#f4f1ff) 0 0/100% 34% no-repeat,conic-gradient(#e2e8ff 25%,#f4f6ff 0 50%,#e2e8ff 0 75%,#f4f6ff 0) 0 0/24px 24px}
.floor--bath{background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 2px,transparent 2px 40px),linear-gradient(#d9dff5,#cfd6f0)}
.wall--bed{background:radial-gradient(rgba(255,255,255,.72) 1.4px,transparent 2px) 0 0/34px 34px,radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.6px) 17px 17px/34px 34px,linear-gradient(#d6c5f4,#e6dbfb)}
.floor--bed{background:repeating-linear-gradient(90deg,rgba(90,60,140,.08) 0 2px,transparent 2px 70px),linear-gradient(#cbb4ea,#bea5e2)}
.wall--play{background:radial-gradient(rgba(255,201,120,.35) 3px,transparent 3.6px) 0 0/30px 30px,linear-gradient(#fff0dc,#fff7ec)}
.floor--play{background:conic-gradient(#ffd0de 25%,#d4ecff 0 50%,#fff0b8 0 75%,#d6f3e1 0) 0 0/58px 58px}
.win .w-night{display:none}
html.sky-night .win .w-night{display:inline}
html.sky-night .win .w-day{display:none}
html.sky-eve .win .w-sun{fill:#ffb27a}
.lamp-glow{transition:opacity .6s}
.scene.is-night .lamp-glow{opacity:0}
.room.has-bigbowl .itm-bowl,.room.has-bed .itm-blanket{display:none}

/* ---------- pet ---------- */
.pet{position:absolute;left:50%;bottom:4%;z-index:5;height:52%;aspect-ratio:1/1;transform:translateX(-50%);touch-action:none;cursor:pointer}
.pet-svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.pet-svg .p-all{transform-box:view-box;transform-origin:120px 228px;animation:breath 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.012,.988)}}
.pet-svg .p-head{transform-box:view-box;transform-origin:120px 150px;animation:headBob 3.2s ease-in-out infinite}
@keyframes headBob{50%{transform:translateY(1.6px) rotate(-1.2deg)}}
.pet-svg .p-tail{transform-box:view-box;transform-origin:162px 192px;animation:wag .42s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.pet-svg .p-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pet-svg .p-ear{transform-box:view-box;transition:transform .5s var(--ease)}
.pet-svg .p-ear-l{transform-origin:84px 70px}
.pet-svg .p-ear-r{transform-origin:156px 70px}
.pet.is-happy .p-eo,.pet.is-pet .p-eo,.pet.is-eat .p-eo{display:none}
.pet.is-happy .p-eh,.pet.is-pet .p-eh,.pet.is-eat .p-eh{display:inline}
.pet.is-happy .p-m,.pet.is-eat .p-m{display:none}
.pet.is-happy .p-mo,.pet.is-eat .p-mo{display:inline}
.pet.is-happy .p-all{animation:hop .55s var(--ease) 2}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(.98,1.03)}60%{transform:translateY(0) scale(1.04,.96)}}
.pet.is-happy .p-tail,.pet.is-pet .p-tail{animation-duration:.18s}
.pet.is-happy .p-ear-l{transform:rotate(-10deg)}
.pet.is-happy .p-ear-r{transform:rotate(10deg)}
.pet.is-pet .p-head{animation:tilt .9s ease-in-out}
@keyframes tilt{40%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
.pet.is-eat .p-mo{transform-box:fill-box;transform-origin:center top;animation:chomp .22s ease-in-out infinite alternate}
@keyframes chomp{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
.pet.is-eat .p-head{animation:eatBob .44s ease-in-out infinite}
@keyframes eatBob{50%{transform:translateY(3px) rotate(1deg)}}
.pet.is-sleep .p-eo{display:none}
.pet.is-sleep .p-es{display:inline}
.pet.is-sleep .p-all{animation:breath 4.6s ease-in-out infinite}
.pet.is-sleep .p-head{animation:none;transform:translateY(6px) rotate(-6deg)}
.pet.is-sleep .p-tail{animation:none;transform:rotate(-14deg)}
.pet.is-sleep .p-ear-l{transform:rotate(8deg)}
.pet.is-sleep .p-ear-r{transform:rotate(-8deg)}
.pet.is-sad .p-br,.pet.is-no .p-br{display:inline}
.pet.is-sad .p-m{display:none}
.pet.is-sad .p-ms{display:inline}
.pet.is-sad .p-ear-l{transform:rotate(14deg)}
.pet.is-sad .p-ear-r{transform:rotate(-14deg)}
.pet.is-sad .p-tail{animation:wag 1.6s ease-in-out infinite alternate}
.pet.is-no .p-head{animation:no .55s ease-in-out}
@keyframes no{20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(5deg)}}
.pet.is-shake .p-all{animation:shakeOff .6s ease-in-out}
@keyframes shakeOff{15%,45%,75%{transform:rotate(-6deg)}30%,60%,90%{transform:rotate(6deg)}}
.pet.is-walk .p-all{animation:walk .62s var(--ease)}
@keyframes walk{25%{transform:translateY(-9px) rotate(-3deg)}50%{transform:translateY(0)}75%{transform:translateY(-6px) rotate(3deg)}}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 34% 30%,#fff 0 16%,rgba(255,255,255,.7) 28%,rgba(208,226,255,.5) 68%,rgba(255,255,255,.95) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 1px 3px rgba(120,140,200,.25);animation:bubIn .3s var(--spring) backwards,bubWob 2.2s ease-in-out infinite alternate}
@keyframes bubIn{from{transform:translate(-50%,-50%) scale(0)}}
@keyframes bubWob{to{transform:translate(-50%,-56%) scale(1.06)}}
.bub.pop{animation:bubPop .32s var(--ease) forwards}
@keyframes bubPop{to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}

/* ---------- scene overlays ---------- */
.night{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(120% 75% at 24% 24%,rgba(28,18,64,.22),rgba(28,18,64,.66) 62%);opacity:0;transition:opacity 1s var(--ease)}
.scene.is-night .night{opacity:1}
.zz{position:absolute;z-index:9;pointer-events:none;font-family:var(--font-display);font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(40,20,90,.6);animation:zz 2.8s ease-out forwards}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(34px,-70px) scale(1.25);opacity:0}}
.shower{position:absolute;left:50%;top:0;z-index:9;width:44%;height:100%;transform:translate(-50%,-110%);transition:transform .5s var(--ease);pointer-events:none}
.scene.is-shower .shower{transform:translate(-50%,0)}
.shower svg{display:block;width:100%;height:auto}
.drops{position:absolute;left:12%;right:12%;top:12%;bottom:6%;opacity:0;transition:opacity .3s}
.scene.is-shower .drops{opacity:1;transition-delay:.35s}
.drops i{position:absolute;top:0;width:3px;height:16px;border-radius:2px;background:linear-gradient(rgba(150,195,255,0),rgba(150,195,255,.95));animation:fall .6s linear infinite}
@keyframes fall{from{top:-4%;opacity:0}12%{opacity:1}to{top:96%;opacity:.25}}
.sponge{position:absolute;left:0;top:0;z-index:9;width:58px;pointer-events:none;opacity:0;transition:opacity .2s}
.sponge.is-on{opacity:1}
.toast{position:absolute;left:50%;top:62px;z-index:60;padding:9px 16px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.45),0 12px 26px -12px rgba(206,58,110,.6);font-weight:800;font-size:14px;color:var(--rose-deep);white-space:nowrap;opacity:0;transform:translate(-50%,-10px);transition:opacity .25s var(--ease),transform .35s var(--spring);pointer-events:none}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ---------- panel ---------- */
.panel{flex:none;position:relative;height:112px}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;opacity:0;visibility:hidden;transform:translate3d(0,8px,0);transition:opacity .25s var(--ease),transform .35s var(--ease),visibility 0s linear .35s}
.pane.is-on{opacity:1;visibility:visible;transform:none;transition:opacity .35s var(--ease) .12s,transform .45s var(--ease) .12s,visibility 0s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,#ff97b8 0%,#ff6795 100%);color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(196,40,92,.16),0 12px 22px -12px rgba(230,79,126,.8);transition:transform .18s var(--ease)}
.btn:active{transform:scale(.95)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn--ghost{background:#fff;color:var(--rose-deep);box-shadow:0 0 0 1.5px rgba(255,140,175,.6)}
.hint{margin:0;max-width:30ch;font-weight:700;font-size:13px;line-height:1.35;color:var(--ink-soft);text-align:center}
.foods{display:flex;gap:8px;width:100%;overflow-x:auto;padding:3px 2px 5px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.foods::-webkit-scrollbar{display:none}
.food{flex:0 0 auto;width:80px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 7px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.42),0 8px 16px -12px rgba(206,58,110,.55);scroll-snap-align:start;transition:transform .18s var(--ease),opacity .3s}
.food:active{transform:scale(.94)}
.food .fi{width:38px;height:38px}
.food b{font-size:12.5px;font-weight:800;line-height:1.2}
.eff{display:flex;justify-content:center;gap:6px;margin-top:1px}
.eff span{display:inline-flex;align-items:center;gap:1px;font-weight:800;font-size:11px;line-height:1.2}
.eff svg{width:11px;height:11px;fill:currentColor}
.price{display:inline-flex;align-items:center;gap:3px;margin-top:2px;font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--ink)}
.price svg{width:14px;height:14px}
.food.is-locked{opacity:.5}
.is-nope{animation:nope .4s ease-in-out}
@keyframes nope{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px 11px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.42),0 8px 16px -12px rgba(206,58,110,.55);text-align:left;transition:transform .18s var(--ease)}
.gcard:active{transform:scale(.96)}
.gcard b{font-family:var(--font-display);font-size:14px;line-height:1.2}
.gcard small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.gcard .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 12px;border-radius:999px;background:linear-gradient(180deg,#ff97b8,#ff6795);color:#fff;font-weight:800;font-size:12.5px}
.gcard .go i{display:inline-flex;align-items:center;gap:1px;font-style:normal;opacity:.95}
.gcard .go svg{width:12px;height:12px;fill:currentColor}

/* ---------- tabs ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.38),0 10px 22px -16px rgba(206,58,110,.5)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:17px;color:var(--ink-soft);font-weight:800;font-size:10.5px;transition:background .3s,color .3s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{background:#ffe3ec;color:var(--rose-deep)}

/* ---------- shop ---------- */
.sheet-bg{position:absolute;inset:0;z-index:30;background:rgba(87,32,61,.3);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s}
.sheet-bg.is-on{opacity:1;visibility:visible;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:84%;display:flex;flex-direction:column;border-radius:26px 26px 30px 30px;background:#fff8fb;box-shadow:0 -12px 30px -18px rgba(150,40,80,.5);transform:translate3d(0,105%,0);transition:transform .45s var(--ease)}
.sheet.is-on{transform:none}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px 20px}
.sheet-h h2{margin:0;font-family:var(--font-display);font-size:20px}
.x{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.45)}
.x svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.sheet-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{margin:10px 4px 0;font-weight:800;font-size:12.5px;color:var(--ink-soft)}
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.4)}
.th{flex:none;width:54px;height:54px;border-radius:14px;background:#fff3f7;display:grid;place-items:center;overflow:hidden}
.th svg{width:42px;height:42px}
.th .sw{width:100%;height:100%}
.tx{flex:1 1 auto;min-width:0}
.tx b{display:block;font-size:15px;line-height:1.25}
.tx small{display:block;font-size:12px;font-weight:700;line-height:1.3;color:var(--ink-soft)}
.buy{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 13px;border-radius:999px;background:linear-gradient(180deg,#ff97b8,#ff6795);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;box-shadow:0 8px 14px -10px rgba(230,79,126,.8)}
.buy svg{width:15px;height:15px}
.buy.is-owned{background:#ffe9f0;color:var(--rose-deep);box-shadow:none}
.buy.is-locked{background:#f5eef2;color:#a7929d;box-shadow:none}
.buy.is-locked svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- games ---------- */
.game{position:absolute;inset:0;z-index:40;background:#ffeef4;border-radius:30px;overflow:hidden}
.game canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.g-hud{position:absolute;left:12px;right:12px;top:12px;z-index:2;display:flex;align-items:center;gap:8px;pointer-events:none}
.g-pill{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(255,170,198,.45);font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.g-hud .x{margin-left:auto;pointer-events:auto}
.g-card{position:absolute;left:50%;top:50%;z-index:3;width:min(86%,320px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 20px 20px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.4),0 24px 50px -24px rgba(160,44,96,.55);text-align:center;transform:translate(-50%,-50%)}
.g-card h3{margin:0;font-family:var(--font-display);font-size:21px}
.g-card p{margin:0;font-weight:600;font-size:14.5px;line-height:1.45;color:var(--ink-soft)}
.res{display:grid;grid-template-columns:1fr auto;gap:7px 18px;width:100%;margin:0;font-weight:700;font-size:15px}
.res dt{text-align:left;color:var(--ink-soft)}
.res dd{margin:0;text-align:right;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.g-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.g-actions .btn{min-height:46px;padding:0 20px;font-size:15px}

/* ---------- one-time note ---------- */
.note{position:absolute;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;border-radius:30px;background:rgba(87,32,61,.32);opacity:0;transition:opacity .4s var(--ease)}
.note.is-on{opacity:1}
.note-card{width:min(100%,320px);display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 22px 20px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px rgba(255,170,198,.4),0 24px 50px -24px rgba(160,44,96,.6);text-align:center;transform:translate3d(0,14px,0) scale(.96);transition:transform .5s var(--spring)}
.note.is-on .note-card{transform:none}
.note-card p{margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.45;color:var(--ink);text-wrap:balance}

/* ---------- misc ---------- */
.fly{position:fixed;left:0;top:0;z-index:65;width:44px;height:44px;pointer-events:none}
.fly svg{width:100%;height:100%}
.fx{position:fixed;left:0;top:0;z-index:80;width:100%;height:100%;pointer-events:none}
.turn{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--ground);font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink);text-align:center}
.turn svg{width:54px;height:54px;fill:none;stroke:var(--rose-deep);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:turn 2.4s var(--ease) infinite}
@keyframes turn{0%,20%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.turn{display:flex}.app{visibility:hidden}}
@media (max-height:620px){.stats .stat span{display:none}.ring{width:40px;height:40px}.ring .ic{width:18px;height:18px}.panel{height:104px}.btn{min-height:46px}.top{height:36px}}
@media (prefers-reduced-motion:reduce){.pet-svg *{animation-duration:0s!important}}
</style>
</head>

/* ---------- mini-games ---------- */
const Game = (() => {

  };

  const petImg = img(petSVG(PAL));
  const boneSVG = (a, b) => '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="rotate(-30 24 24)"><g fill="' + b + '"><rect x="11" y="19.5" width="26" height="9" rx="3"/><circle cx="11" cy="19" r="6.4"/><circle cx="11" cy="29" r="6.4"/><circle cx="37" cy="19" r="6.4"/><circle cx="37" cy="29" r="6.4"/></g><g fill="' + a + '"><rect x="11" y="21" width="26" height="6" rx="2"/><circle cx="11" cy="19" r="5"/><circle cx="11" cy="29" r="5"/><circle cx="37" cy="19" r="5"/><circle cx="37" cy="29" r="5"/></g></g></svg>';
  const boneImg = img(boneSVG('#fff6ea', '#e6c9a3')), goldImg = img(boneSVG('#ffe08a', '#eeae35'));
  let W = 0, H = 0, D = 1, k = 1, mode = 'catch', state = 'off', raf = 0, last = 0, score = 0, shake = 0;
  let px = 0, tx = 0, items = [], spawnT = 0, time = 0;
  let py = 0, vy = 0, grounded = true, jumps = 0, spin = 0, speed = 0, dist = 0, obs = [], bones = [], bonus = 0, tt = 0;
  const decor = Array.from({ length: 9 }, () => ({ x: Math.random(), y: Math.random() * 0.7, r: rand(14, 46) }));

  function size() {
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height; D = Math.min(2, window.devicePixelRatio || 1); k = H / 640;

  const petS = () => (mode === 'run' ? H * 0.19 : Math.min(W * 0.34, H * 0.24));

  function reset() {

    else { py = gy(); vy = 0; grounded = true; jumps = 0; spin = 0; speed = 340 * k; dist = 0; obs = []; bones = []; bonus = 0; spawnT = 1.1; }
    hud();
  }
  function hud() {
    scoreEl.textContent = String(score);
    timeEl.hidden = mode !== 'catch';
    if (mode === 'catch') timeEl.textContent = '0:' + String(Math.max(0, Math.ceil(time))).padStart(2, '0');
  }

  function update(dt) {
    tt += dt;
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (mode === 'catch') {
      time -= dt;
      if (time <= 0) { time = 0; hud(); return finish(); }
      const prog = 1 - time / 30;
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = lerp(0.8, 0.38, prog) * rand(0.7, 1.2);
        items.push({ x: rand(26 * k + 10, W - 26 * k - 10), y: -30, vy: lerp(170, 320, prog) * rand(0.85, 1.2) * k, gold: Math.random() < 0.1, r: rand(-1, 1), vr: rand(-3, 3) });
      }
      px += (tx - px) * (1 - Math.exp(-dt * 14));
      const s = petS(), g = gy();
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy * dt; it.r += it.vr * dt;
        if (it.y > g - s * 0.9 && it.y < g - s * 0.25 && Math.abs(it.x - px) < s * 0.4) {
          items.splice(i, 1);
          score += it.gold ? 3 : 1; hud();
          const r = cv.getBoundingClientRect();
          FX.burst(r.left + it.x, r.top + it.y, { n: it.gold ? 10 : 5, speed: 180, g: 300, min: 5, max: 11, hearts: 0.4, colors: it.gold ? ['#ffc978', '#ffe08a', '#fff'] : null });
          Sound.pop();
        } else if (it.y > H + 40) items.splice(i, 1);
      }
    } else {
      speed = Math.min(800 * k, speed + 16 * k * dt);
      if (spin > 0) spin = Math.min(6.2832, spin + dt * 13);
      dist += speed * dt;
      vy += 2600 * k * dt; py += vy * dt;
      const g = gy();
      if (py >= g) { py = g; vy = 0; grounded = true; jumps = 0; spin = 0; }
      spawnT -= dt;
      if (spawnT <= 0) {
        const hard = clamp((speed / k - 340) / 360, 0, 1), r = Math.random();
        const kind = r < 0.12 + hard * 0.2 ? 'tall' : r < 0.22 + hard * 0.36 ? 'long' : r < 0.62 + hard * 0.2 ? 'box' : 'bush';
        const w = kind === 'long' ? rand(78, 104) : kind === 'tall' ? rand(32, 40) : rand(28, 44);
        const h = kind === 'tall' ? rand(100, 128) : kind === 'long' ? rand(32, 46) : kind === 'box' ? rand(32, 62) : rand(26, 44);
        obs.push({ x: W + 30, w: w * k, h: h * k, kind });
        spawnT = rand(0.85, 1.45) * ((300 * k) / speed) + 0.28 + (kind === 'tall' || kind === 'long' ? 0.12 : 0);
        if (Math.random() < 0.55) bones.push({ x: W + 30 + rand(90, 170) * k, y: g - rand(80, 170) * k, r: 0 });

        if (Math.abs(b.x - (x0 + s / 2)) < s * 0.42 && Math.abs(b.y - (py - s * 0.5)) < s * 0.48) {

        }

  }

  function bg() {
    const grd = cx.createLinearGradient(0, 0, 0, H);
    if (mode === 'run') { grd.addColorStop(0, '#d7efff'); grd.addColorStop(1, '#ffe6f0'); }
    else { grd.addColorStop(0, '#fff1f6'); grd.addColorStop(1, '#ffe0ea'); }
    cx.fillStyle = grd; cx.fillRect(0, 0, W, H);
    cx.fillStyle = 'rgba(255,255,255,.6)';
    const off = mode === 'run' ? dist * 0.08 : 0;
    decor.forEach((d) => { const x = (((d.x * W - off) % (W + 120)) + W + 120) % (W + 120) - 60; cx.beginPath(); cx.arc(x, d.y * H * (mode === 'run' ? 0.6 : 1), d.r * k, 0, 6.283); cx.fill(); });
    const g = gy();
    if (mode === 'run') {
      cx.fillStyle = '#ffd3e1';
      cx.beginPath(); cx.moveTo(0, g);
      const hoff = dist * 0.25;
      for (let x = 0; x <= W + 20; x += 20) cx.lineTo(x, g - 46 * k - Math.sin((x + hoff) / (90 * k)) * 22 * k);
      cx.lineTo(W, g); cx.closePath(); cx.fill();
    }
    cx.fillStyle = '#ffcadb'; cx.fillRect(0, g, W, H - g);
    cx.fillStyle = '#ffb3cb'; cx.fillRect(0, g, W, 6 * k);
    if (mode === 'run') {
      cx.fillStyle = 'rgba(255,255,255,.55)';
      const step = 46 * k, o = dist % step;
      for (let x = -o; x < W; x += step) cx.fillRect(x, g + 20 * k, 18 * k, 4 * k);
    }
  }
  function drawPet(x, y, s, rot) {
    if (!petImg.complete) return;
    cx.save(); cx.translate(x + s / 2, y + s); if (rot) cx.rotate(rot);
    cx.drawImage(petImg, -s / 2, -s, s, s); cx.restore();
  }
  function draw() {
    cx.setTransform(D, 0, 0, D, 0, 0);
    if (shake > 0) cx.translate(rand(-6, 6) * shake, rand(-6, 6) * shake);
    bg();
    const g = gy(), s = petS();
    if (mode === 'catch') {
      const sz = 44 * k;
      items.forEach((it) => { cx.save(); cx.translate(it.x, it.y); cx.rotate(it.r); cx.drawImage(it.gold ? goldImg : boneImg, -sz / 2, -sz / 2, sz, sz); cx.restore(); });
      drawPet(px - s / 2, g - s * 0.955 + Math.sin(tt * 9) * 1.5 * k, s, (tx - px) / (W * 4));
    } else {
      obs.forEach((o) => {
        const y = g - o.h;
        if (o.kind !== 'bush') {
          const box = (bx, by, bw, bh) => {
            cx.fillStyle = '#efbe8e'; rr(bx, by, bw, bh, 5 * k); cx.fill();
            cx.fillStyle = '#e2a874'; cx.fillRect(bx + bw * 0.4, by, bw * 0.2, bh);
            cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(bx + 3 * k, by + 3 * k, bw - 6 * k, 3 * k);
            cx.strokeStyle = 'rgba(160,90,50,.25)'; cx.lineWidth = 1.5 * k; cx.strokeRect(bx + 0.75 * k, by + 0.75 * k, bw - 1.5 * k, bh - 1.5 * k);
          };
          if (o.kind === 'tall') { box(o.x, y + o.h / 2, o.w, o.h / 2); box(o.x + o.w * 0.06, y, o.w * 0.88, o.h / 2); }
          else if (o.kind === 'long') { box(o.x, y, o.w / 2, o.h); box(o.x + o.w / 2, y + o.h * 0.15, o.w / 2, o.h * 0.85); }
          else box(o.x, y, o.w, o.h);
        } else {
          cx.fillStyle = '#7ccb98';
          const r = o.w * 0.42;
          [[0.28, 0.62], [0.72, 0.6], [0.5, 0.36]].forEach((c) => { cx.beginPath(); cx.arc(o.x + o.w * c[0], y + o.h * c[1], r, 0, 6.283); cx.fill(); });
          cx.fillRect(o.x + o.w * 0.1, y + o.h * 0.55, o.w * 0.8, o.h * 0.45);
          cx.fillStyle = '#ff9fbd'; cx.beginPath(); cx.arc(o.x + o.w * 0.4, y + o.h * 0.4, 3.2 * k, 0, 6.283); cx.arc(o.x + o.w * 0.66, y + o.h * 0.66, 3.2 * k, 0, 6.283); cx.fill();
        }
      });
      const sz = 38 * k;
      bones.forEach((b) => { cx.save(); cx.translate(b.x, b.y); cx.rotate(Math.sin(b.r) * 0.4); cx.drawImage(boneImg, -sz / 2, -sz / 2, sz, sz); cx.restore(); });
      const bob = grounded && state === 'play' ? Math.abs(Math.sin(tt * 12)) * 4 * k : 0;
      drawPet(W * 0.16, py - s * 0.955 - bob, s, grounded ? 0 : spin > 0 ? -spin : clamp(vy / (2600 * k), -0.4, 0.4) * 0.6);
    }
  }
  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r); cx.lineTo(x + w, y + h); cx.lineTo(x, y + h); cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y); cx.closePath(); }

  function loop(now) {
    raf = 0;
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    try { if (state === 'play') update(dt); draw(); } catch (e) { /* keep running */ }
    if (state === 'play' || shake > 0) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  function begin() {
    if (S.energy < GAME_COST) { toast('Мало энергии'); Sound.error(); return; }
    change('energy', -GAME_COST);
    startCard.hidden = true; endCard.hidden = true;
    reset(); state = 'play'; kick();
  }
  function finish() {
    if (state !== 'play') return;
    state = 'end';
    const coins = mode === 'catch' ? score : Math.floor(score / 10);
    const xp = 8 + Math.min(30, mode === 'catch' ? Math.floor(score / 2) : Math.floor(score / 40));
    const best = Math.max(S.best[mode] || 0, score);
    S.best[mode] = best;
    S.fun = clamp(S.fun + 14, 0, 100);
    $('#rScore').textContent = String(score);
    $('#rBest').textContent = String(best);
    $('#rCoins').textContent = '+' + coins;
    setTimeout(() => {
      endCard.hidden = false;
      if (coins) addCoins(coins);
      addXP(xp); renderStats(); renderBest(); save();
    }, 450);
    kick();
  }
  function open(m) {
    if (S.sleeping) return;
    if (S.energy < GAME_COST) { toast('Мало энергии'); Sound.error(); return; }
    mode = m;
    wrap.hidden = false; size();
    $('#gTitle').textContent = INFO[m].title; $('#gHow').textContent = INFO[m].how;
    startCard.hidden = false; endCard.hidden = true;
    reset(); state = 'ready'; draw();
    if (!petImg.complete) petImg.onload = () => draw();
  }
  function close() {
    if (state === 'play') { finish(); }
    state = 'off'; wrap.hidden = true; cancelAnimationFrame(raf); raf = 0;
  }
  function jump() {
    if (state !== 'play' || mode !== 'run') return;
    if (grounded) { vy = -820 * k; grounded = false; jumps = 1; Sound.jump(); }
    else if (jumps < 2) {
      vy = -760 * k; jumps = 2; spin = 0.01; Sound.jump2(); Haptic.tap(8);
      const r = cv.getBoundingClientRect(), s = petS();
      FX.burst(r.left + W * 0.16 + s / 2, r.top + py - s * 0.15, { n: 8, speed: 150, g: 260, min: 5, max: 10, hearts: 0.3 });
    }
  }
  function point(e) { const r = cv.getBoundingClientRect(); return e.clientX - r.left; }
  cv.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    if (state !== 'play') return;
    if (mode === 'catch') { tx = clamp(point(e), 20, W - 20); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
    else jump();
  });
  cv.addEventListener('pointermove', (e) => { if (state === 'play' && mode === 'catch' && (e.buttons || e.pointerType !== 'mouse')) tx = clamp(point(e), 20, W - 20); });
  window.addEventListener('keydown', (e) => {
    if (wrap.hidden || state !== 'play') return;
    if (mode === 'run' && (e.code === 'Space' || e.key === 'ArrowUp') && !e.repeat) { e.preventDefault(); jump(); }
    if (mode === 'catch' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) tx = clamp(tx + (e.key === 'ArrowLeft' ? -60 : 60), 20, W - 20);
  });
  $('#gGo').addEventListener('click', begin);
  $('#gAgain').addEventListener('click', begin);
  $('#gExit').addEventListener('click', close);
  $('#gX').addEventListener('click', close);
  return { open, resize() { if (!wrap.hidden) { size(); if (state !== 'play') draw(); } } };
})();
function renderBest() { $$('[data-best]').forEach((s) => { s.textContent = String(S.best[s.dataset.best] || 0); }); }
$$('.gcard').forEach((c) => c.addEventListener('click', () => {
  if (S.energy < GAME_COST) { nope(c); toast('Мало энергии'); Sound.error(); return; }
  Sound.unlock(); Game.open(c.dataset.game);
}));

/* ---------- sound button, global ---------- */
const snd = $('#snd');
function syncSnd() { snd.setAttribute('aria-pressed', String(Sound.on)); snd.setAttribute('aria-label', Sound.on ? 'Выключить звук' : 'Включить звук'); }
snd.addEventListener('click', () => { Sound.unlock(); Sound.set(!Sound.on); syncSnd(); if (Sound.on) setTimeout(() => Sound.boop(), 60); });
syncSnd();
['pointerup', 'touchend', 'click', 'keydown'].forEach((t) => window.addEventListener(t, () => Sound.unlock(), { capture: true, passive: true }));
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => {
  simulate(Date.now());
  if (document.hidden) saveNow(); else renderStats();
  Sound.visible(!document.hidden);
});
window.addEventListener('pagehide', () => { simulate(Date.now()); saveNow(); });
let rz = 0;
function onResize() { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { sizeApp(); FX.resize(); Game.resize(); }); }
window.addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 300));

/* ---------- start ---------- */
renderTop(); renderFoods(); renderRooms(); renderBest();
if (S.sleeping) { S.sleeping = false; goRoom(3, true); setSleep(true); }
else goRoom(S.room || 0, true);
renderStats();
setInterval(() => { simulate(Date.now()); renderStats(); }, 1000);
setInterval(saveNow, 10000);

/* разовое уведомление для favie */
(() => {
  const NOTE_KEY = 'nam2-note-sorry-1';
  let user = '';
  try { user = (JSON.parse(localStorage.getItem('nam2-session') || 'null') || {}).u || ''; } catch (e) { /* ignore */ }
  let seen = false;
  try { seen = localStorage.getItem(NOTE_KEY) === '1'; } catch (e) { /* ignore */ }
  if (user !== 'favie' || seen) return;
  const note = $('#note');
  setTimeout(() => { note.hidden = false; void note.offsetWidth; note.classList.add('is-on'); try { localStorage.setItem(NOTE_KEY, '1'); } catch (e) { /* ignore */ } }, 700);
  $('#noteOk').addEventListener('click', () => { note.classList.remove('is-on'); setTimeout(() => { note.hidden = true; }, 400); });
})();
})();
</script>
